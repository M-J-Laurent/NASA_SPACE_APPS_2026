<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth Change Detective</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="globe"></div>

  <aside id="left">
    <h1>Earth Change Detective</h1>
    <p class="sub">What is changing on Earth, where, how fast &mdash; and is it statistically significant?</p>
    <div id="banner" hidden>Demo uses <b>synthetic</b> data, not real measurements.</div>
    <div id="interpWarn" hidden></div>

    <div class="toolbar">
      <button id="gear" class="tool" aria-expanded="false" title="Display settings">⚙ Settings</button>
    </div>

    <div id="settings" hidden>
      <label class="sel">Colour by
        <select id="colorBy">
          <option value="fade">Rate of change, see-through where not significant</option>
          <option value="rate">Rate of change only</option>
          <option value="sig">Significance (confidence in the trend)</option>
        </select>
      </label>
      <label class="sel">Base map
        <select id="baseMap">
          <option value="satellite">Satellite land, contoured sea</option>
          <option value="plain">Plain dark</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="observedOnly" /> Observed data only (no interpolation)</label>
    </div>

    <h2>Guided demos</h2>
    <div id="demos"></div>

    <h2>Layer</h2>
    <input id="search" type="search" placeholder="Search layers…" autocomplete="off" />
    <div id="layers"></div>
    <div id="noMatch" class="hint" hidden>No layers match.</div>

    <div id="about"></div>

    <details>
      <summary>How is this calculated?</summary>
      <div id="method"></div>
    </details>
  </aside>

  <div id="quick">
    <div id="locNote" hidden></div>
    <div class="pill">
      <button id="locate" title="Show statistics for where you are (your position never leaves your browser)">📍 Use my location</button>
      <label class="spinlabel" title="Slowly rotate the globe"><input type="checkbox" id="spin" checked /> ⟳ Auto-rotate</label>
    </div>
  </div>

  <div id="legend"></div>

  <aside id="right">
    <button id="close" aria-label="Back to global overview" title="Back to global overview">&times;</button>
    <div id="detail"></div>
  </aside>

  <div id="story" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
